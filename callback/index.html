<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>TikTok Auth</title><style>body{font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.box{background:#1a1a1a;padding:32px;border-radius:16px;max-width:600px;width:100%;border:1px solid #333;text-align:center}code{background:#000;padding:16px;display:block;border-radius:8px;word-break:break-all;margin:12px 0}</style></head><body><div class="box"><h2 style="color:#fe2c55">🎬 TikTok - JARVIS</h2><p id="msg">Vérif...</p><code id="c" style="display:none"></code><button id="b" style="display:none">📋 Copier</button></div><script>const p=new URLSearchParams(location.search),c=p.get('code');const m=document.getElementById('msg'),co=document.getElementById('c'),b=document.getElementById('b');if(c){m.innerHTML='✅ CODE TROUVÉ ! Copie vite :';co.textContent=c;co.style.display='block';b.style.display='block';b.onclick=()=>navigator.clipboard.writeText(c);}else{m.textContent='En attente de ?code=... Ouvre l URL TikTok d abord';}</script></body></html>
